name: .NET CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 1. Build the API
    - name: Restore API
      run: dotnet restore RaceDay.API/RaceDay.API.csproj
    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

    # 2. Build the MVC Web App
    - name: Restore Web
      run: dotnet restore RaceDay.web/RaceDay.web.csproj
    - name: Build Web
      run: dotnet build RaceDay.web/RaceDay.web.csproj --no-restore --configuration Release

    # 3. Run Unit Tests
    - name: Restore Tests
      run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj
    - name: Run Tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --verbosity normal
